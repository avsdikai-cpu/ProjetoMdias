<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJETOS M. DIAS - Sistema Completo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    :root { --primary: #004b93; --bg: #f4f6f9; }
    body { background-color: var(--bg); font-family: system-ui, -apple-system, sans-serif; }
    .main-card { max-width: 1050px; margin: 0 auto; border: none; border-top: 5px solid var(--primary); }
    .nav-pills .nav-link.active { background-color: var(--primary); }
    .nav-pills .nav-link { color: var(--primary); font-weight: 600; }
    .section-header { background-color: #eef4fa; color: var(--primary); font-size: 0.95rem; font-weight: 700; padding: 10px; border-radius: 6px; margin: 15px 0 10px 0; }
  </style>
</head>
<body class="py-3 px-2">

  <div class="container-fluid">
    <div class="card shadow-sm main-card">
      <div class="card-body p-3 p-md-4">
        
        <!-- Cabeçalho -->
        <div class="text-center pb-3 mb-3 border-bottom">
          <h2 class="fw-bold text-primary m-0" style="color: #004b93 !important;">PROJETOS M. DIAS</h2>
          <small class="text-muted fw-semibold">Gestão de Instalação, Suportes, Atividades e Teste de Potência</small>
        </div>

        <!-- NAVEGAÇÃO COMPLETA -->
        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
          <li class="nav-item">
            <button class="nav-link active small" id="tab-inst" data-bs-toggle="pill" data-bs-target="#pills-inst">
              <i class="bi bi-tools"></i> 1. Instalação
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link small" id="tab-suportes" data-bs-toggle="pill" data-bs-target="#pills-suportes">
              <i class="bi bi-ruler"></i> 2. Suportes (PE & GMA)
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link small" id="tab-ativ" data-bs-toggle="pill" data-bs-target="#pills-ativ">
              <i class="bi bi-journal-check"></i> 3. Atividades / OS
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link small" id="tab-pot" data-bs-toggle="pill" data-bs-target="#pills-pot">
              <i class="bi bi-lightning-charge"></i> 4. Teste de Potência
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link small" id="tab-rel" data-bs-toggle="pill" data-bs-target="#pills-rel" onclick="carregarRelatorios()">
              <i class="bi bi-file-earmark-pdf"></i> Relatórios
            </button>
          </li>
        </ul>

        <div class="tab-content">
          
          <!-- ABA 1: INSTALAÇÕES (Aba Instalação da planilha) -->
          <div class="tab-pane fade show active" id="pills-inst">
            <form onsubmit="salvarGenerico(event, 'Instalação')">
              <div class="section-header"><i class="bi bi-geo-alt-fill"></i> Registro de Instalação e Teste</div>
              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Unidade</label>
                  <select class="form-select select-unid" required onchange="popularLinhas(this, 'lin-inst')">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Jaboatão - PE (JGU)">Jaboatão - PE (JGU)</option>
                    <option value="Bahia (GMA)">Bahia (GMA)</option>
                    <option value="Fortaleza">Fortaleza</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Linha</label>
                  <select id="lin-inst" class="form-select select-lin" required></select>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-4"><label class="form-label small fw-bold">Equipamento</label><input type="text" class="form-control eq" placeholder="Ex: FlowPack 01 / SBB / GS" required></div>
                <div class="col-md-4"><label class="form-label small fw-bold">Nº de Série</label><input type="text" class="form-control serie" required></div>
                <div class="col-md-4"><label class="form-label small fw-bold">Data da Instalação e Teste</label><input type="date" class="form-control dt-inst" required></div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-6"><label class="form-label small fw-bold">Técnico Executor</label><input type="text" class="form-control tec" required></div>
                <div class="col-md-6"><label class="form-label small fw-bold">Status da Instalação</label>
                  <select class="form-select st-inst">
                    <option value="Concluído e Testado">Concluído e Testado</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Pendente de Teste">Pendente de Teste</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2" style="background-color:#004b93"><i class="bi bi-save"></i> Salvar Instalação e Gerar PDF</button>
            </form>
          </div>

          <!-- ABA 2: SUPORTES E LARGURAS (Aba Largura_Suportes_LDU580 + GMA) -->
          <div class="tab-pane fade" id="pills-suportes">
            <form onsubmit="salvarGenerico(event, 'Medição de Suporte')">
              <div class="section-header"><i class="bi bi-ruler"></i> Mapeamento e Medidas de Suporte (LDU580 / Estrutura)</div>
              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Unidade</label>
                  <select class="form-select select-unid" required onchange="popularLinhas(this, 'lin-sup')">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Jaboatão - PE (JGU)">Jaboatão - PE (JGU)</option>
                    <option value="Bahia (GMA)">Bahia (GMA)</option>
                    <option value="Fortaleza">Fortaleza</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Linha</label>
                  <select id="lin-sup" class="form-select select-lin" required></select>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-3"><label class="form-label small fw-bold">Largura PE (mm)</label><input type="number" class="form-control larg-mm" placeholder="Ex: 730 mm"></div>
                <div class="col-md-3"><label class="form-label small fw-bold">Comprim. Externo BA (cm)</label><input type="number" step="0.1" class="form-control comp-ext" placeholder="Ex: 64.6 cm"></div>
                <div class="col-md-3"><label class="form-label small fw-bold">Comprim. Interno BA (cm)</label><input type="number" step="0.1" class="form-control comp-int" placeholder="Ex: 61.8 cm"></div>
                <div class="col-md-3"><label class="form-label small fw-bold">Quantidade de Datadores</label><input type="number" class="form-control qtd-dat" placeholder="Ex: 3"></div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-6"><label class="form-label small fw-bold">Tipo de Aplicação (Máquina / Enfardadeira)</label><input type="text" class="form-control tipo-app" placeholder="Ex: Embalagem Máq1 / Enfardadeira Máq2"></div>
                <div class="col-md-6"><label class="form-label small fw-bold">Suporte Instalado?</label>
                  <select class="form-select sup-inst">
                    <option value="Sim">Sim</option>
                    <option value="Não">Não</option>
                    <option value="Suporte Diferente do Padrão">Suporte Diferente do Padrão</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2" style="background-color:#004b93"><i class="bi bi-save"></i> Salvar Medidas de Suporte</button>
            </form>
          </div>

          <!-- ABA 3: ATIVIDADES / OS / MANUTENÇÃO (Aba Atividades + Aba Manutenção) -->
          <div class="tab-pane fade" id="pills-ativ">
            <form onsubmit="salvarGenerico(event, 'Atividade / OS / Manutenção')">
              <div class="section-header"><i class="bi bi-journal-text"></i> Registro de Atividades, OS e Manutenção</div>
              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Unidade</label>
                  <select class="form-select select-unid" required onchange="popularLinhas(this, 'lin-atv')">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Jaboatão - PE (JGU)">Jaboatão - PE (JGU)</option>
                    <option value="Bahia (GMA)">Bahia (GMA)</option>
                    <option value="Fortaleza">Fortaleza</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Linha</label>
                  <select id="lin-atv" class="form-select select-lin" required></select>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-4"><label class="form-label small fw-bold">Nº Serie da Máquina</label><input type="text" class="form-control serie" required></div>
                <div class="col-md-4"><label class="form-label small fw-bold">Tipo de Atividade</label>
                  <select class="form-select tipo-ativ">
                    <option value="Manutenção Preventiva">Manutenção Preventiva</option>
                    <option value="Manutenção Corretiva">Manutenção Corretiva</option>
                    <option value="Instalação de Suporte">Instalação de Suporte</option>
                    <option value="Ajuste / Calibração">Ajuste / Calibração</option>
                  </select>
                </div>
                <div class="col-md-4"><label class="form-label small fw-bold">Status da Máquina</label>
                  <select class="form-select st-maq">
                    <option value="Operacional">Operacional</option>
                    <option value="Parada">Parada</option>
                    <option value="Em Teste">Em Teste</option>
                  </select>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-6"><label class="form-label small fw-bold">Descrição do Serviço</label><textarea class="form-control desc" rows="2"></textarea></div>
                <div class="col-md-6"><label class="form-label small fw-bold">Relatório Técnico / Peças Substituídas</label><textarea class="form-control rel-tec" rows="2" placeholder="Peças trocadas, observations..."></textarea></div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-6"><label class="form-label small fw-bold">Técnico Executor</label><input type="text" class="form-control tec" required></div>
                <div class="col-md-6"><label class="form-label small fw-bold">Status da OS</label>
                  <select class="form-select st-os">
                    <option value="Concluída">Concluída</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Aguardando Peça">Aguardando Peça</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2" style="background-color:#004b93"><i class="bi bi-save"></i> Salvar Atividade / OS</button>
            </form>
          </div>

          <!-- ABA 4: TESTE DE POTÊNCIA -->
          <div class="tab-pane fade" id="pills-pot">
            <form onsubmit="salvarGenerico(event, 'Teste de Potência')">
              <div class="section-header"><i class="bi bi-lightning-charge-fill"></i> Aferição de Potência do Laser</div>
              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Unidade</label>
                  <select class="form-select select-unid" required onchange="popularLinhas(this, 'lin-pot')">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Jaboatão - PE (JGU)">Jaboatão - PE (JGU)</option>
                    <option value="Bahia (GMA)">Bahia (GMA)</option>
                    <option value="Fortaleza">Fortaleza</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Linha</label>
                  <select id="lin-pot" class="form-select select-lin" required></select>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-4"><label class="form-label small fw-bold">Nº de Série</label><input type="text" class="form-control serie" required></div>
                <div class="col-md-4"><label class="form-label small fw-bold">Potência Nominal (W)</label><input type="number" class="form-control pot-nom" placeholder="Ex: 30" required></div>
                <div class="col-md-4"><label class="form-label small fw-bold">Potência Medida (W)</label><input type="number" step="0.1" class="form-control pot-med" placeholder="Ex: 28.5" required></div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-6"><label class="form-label small fw-bold">Técnico Aferidor</label><input type="text" class="form-control tec" required></div>
                <div class="col-md-6"><label class="form-label small fw-bold">Data da Aferição</label><input type="date" class="form-control dt-af" required></div>
              </div>

              <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2" style="background-color:#004b93"><i class="bi bi-save"></i> Salvar Teste de Potência</button>
            </form>
          </div>

          <!-- ABA 5: HISTÓRICO DE RELATÓRIOS -->
          <div class="tab-pane fade" id="pills-rel">
            <div class="table-responsive">
              <table class="table table-hover align-middle border small">
                <thead class="table-light">
                  <tr>
                    <th>Data / Reg</th>
                    <th>Tipo</th>
                    <th>Unidade / Linha</th>
                    <th>Nº Série</th>
                    <th>Ação</th>
                  </tr>
                </thead>
                <tbody id="tabelaRelatorios"></tbody>
              </table>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const mapaLinhas = {
      "Jaboatão - PE (JGU)": ["Linha 01", "Linha 02", "Linha 03 Cracker", "Linha 04 Maisena", "Linha 05 Laminados", "Linha 06 Amanteigado", "Linha 07 Granel", "Linha 08 Biscoito", "Linha 09 Biscoito", "Linha 10 Biscoito", "Linha 14 Cracker", "Linha 03 Wafer", "Linha 02 D-Tone", "Linha 04 Massas", "Linha 03 Lasanha", "Linha 05 Massas Lame", "Linha 06 Massas", "Linha 09 Massas 02"],
      "Bahia (GMA)": ["LB01", "LB02", "LB03", "LB04", "LB05", "LB06", "LM01", "LM02", "LM03", "LM04", "LM05"],
      "Fortaleza": ["Linha 01", "Linha 02", "Linha 03"]
    };

    function popularLinhas(elemUnidade, targetId) {
      const unidade = elemUnidade.value;
      const target = document.getElementById(targetId);
      target.innerHTML = '<option value="" disabled selected>Selecione a linha...</option>';

      if (mapaLinhas[unidade]) {
        mapaLinhas[unidade].forEach(l => {
          const opt = document.createElement('option');
          opt.value = l;
          opt.textContent = l;
          target.appendChild(opt);
        });
      }
    }

    function salvarGenerico(e, tipo) {
      e.preventDefault();
      const form = e.target;
      
      const reg = {
        id: Date.now(),
        dataHora: new Date().toLocaleString('pt-BR'),
        tipo: tipo,
        unidade: form.querySelector('.select-unid').value,
        linha: form.querySelector('.select-lin').value,
        numSerie: form.querySelector('.serie') ? form.querySelector('.serie').value : '-',
        tecnico: form.querySelector('.tec') ? form.querySelector('.tec').value : '-',
        equipamento: form.querySelector('.eq') ? form.querySelector('.eq').value : '-',
        larguraMM: form.querySelector('.larg-mm') ? form.querySelector('.larg-mm').value : '-',
        compExt: form.querySelector('.comp-ext') ? form.querySelector('.comp-ext').value : '-',
        compInt: form.querySelector('.comp-int') ? form.querySelector('.comp-int').value : '-',
        qtdDatadores: form.querySelector('.qtd-dat') ? form.querySelector('.qtd-dat').value : '-',
        tipoApp: form.querySelector('.tipo-app') ? form.querySelector('.tipo-app').value : '-',
        tipoAtiv: form.querySelector('.tipo-ativ') ? form.querySelector('.tipo-ativ').value : '-',
        stMaq: form.querySelector('.st-maq') ? form.querySelector('.st-maq').value : '-',
        stOS: form.querySelector('.st-os') ? form.querySelector('.st-os').value : '-',
        descricao: form.querySelector('.desc') ? form.querySelector('.desc').value : '-',
        relTecnico: form.querySelector('.rel-tec') ? form.querySelector('.rel-tec').value : '-',
        potNominal: form.querySelector('.pot-nom') ? form.querySelector('.pot-nom').value : '-',
        potMedida: form.querySelector('.pot-med') ? form.querySelector('.pot-med').value : '-'
      };

      const bd = JSON.parse(localStorage.getItem('bd_mdias_planilhas')) || [];
      bd.push(reg);
      localStorage.setItem('bd_mdias_planilhas', JSON.stringify(bd));

      alert(`${tipo} salvo com sucesso!`);
      gerarPDF(reg);
    }

    function gerarPDF(reg) {
      const { jsPDF } = window.jspdf;
      doc = new jsPDF();

      doc.setFillColor(0, 75, 147);
      doc.rect(0, 0, 210, 18, 'F');
      
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text(`PROJETOS M. DIAS - RELATÓRIO DE ${reg.tipo.toUpperCase()}`, 105, 12, { align: "center" });

      doc.setTextColor(40, 40, 40);
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      
      doc.text(`Data/Hora: ${reg.dataHora}`, 14, 28);
      doc.text(`Unidade: ${reg.unidade}  |  Linha: ${reg.linha}`, 14, 34);
      doc.text(`Nº Série: ${reg.numSerie}  |  Técnico: ${reg.tecnico}`, 14, 40);

      let linhas = [];
      if (reg.tipo === 'Instalação') {
        linhas = [
          ['Equipamento', reg.equipamento],
          ['Data Instalação', reg.dataHora],
          ['Status', 'Instalação e Teste Concluídos']
        ];
      } else if (reg.tipo === 'Medição de Suporte') {
        linhas = [
          ['Largura PE (mm)', reg.larguraMM],
          ['Comprimento Ext. BA (cm)', reg.compExt],
          ['Comprimento Int. BA (cm)', reg.compInt],
          ['Quantidade de Datadores', reg.qtdDatadores],
          ['Aplicação', reg.tipoApp]
        ];
      } else if (reg.tipo === 'Atividade / OS / Manutenção') {
        linhas = [
          ['Tipo de Atividade', reg.tipoAtiv],
          ['Status da Máquina', reg.stMaq],
          ['Status da OS', reg.stOS],
          ['Descrição do Serviço', reg.descricao],
          ['Relatório Técnico / Peças', reg.relTecnico]
        ];
      } else if (reg.tipo === 'Teste de Potência') {
        linhas = [
          ['Potência Nominal', `${reg.potNominal} W`],
          ['Potência Medida', `${reg.potMedida} W`],
          ['Resultado', parseFloat(reg.potMedida) >= (parseFloat(reg.potNominal) * 0.8) ? 'APROVADO' : 'ATENÇÃO']
        ];
      }

      doc.autoTable({
        startY: 46,
        head: [['Campo / Parâmetro', 'Valor / Informação']],
        body: linhas,
        theme: 'striped',
        headStyles: { fillColor: [0, 75, 147] }
      });

      doc.save(`MDIAS_${reg.unidade.split(' ')[0]}_${reg.numSerie}.pdf`);
    }

    function carregarRelatorios() {
      const list = JSON.parse(localStorage.getItem('bd_mdias_planilhas')) || [];
      const tbody = document.getElementById('tabelaRelatorios');
      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">Nenhum registro encontrado.</td></tr>`;
        return;
      }

      list.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.dataHora}</td>
            <td><span class="badge bg-primary">${r.tipo}</span></td>
            <td><strong>${r.unidade}</strong><br>${r.linha}</td>
            <td>${r.numSerie}</td>
            <td><button class="btn btn-sm btn-outline-primary" onclick='gerarPDF(${JSON.stringify(r)})'><i class="bi bi-file-pdf"></i> PDF</button></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
